# E2E 스택. Postgres + Redis + 백엔드(FastAPI·NestJS·Rails 중 하나) + 마이그레이션 +
# 씨앗 데이터 + 이 앱.
#
# 세 백엔드의 공개 계약이 통일되어 있으므로 BACKEND_URL 만 바꿔 다른 백엔드로
# 갈아끼울 수 있다 - 그래서 세 백엔드를 각각 compose profiles 로 묶었다. 정본은
# `template-typescript-nextjs@34d0b10` 의 같은 이름 파일이다(형제 프론트엔드가
# 같은 세 백엔드 템플릿을 상대한다 - 구조를 그대로 미러링하고, 이 파일에 고유한
# 것은 `web` 서비스와 `name` 뿐이다). 아래 "프로파일 - 기본값과 고르는 법" 절이
# 그 전체 그림이다.
#
# 백엔드를 git 컨텍스트로 빌드한다. 형제 디렉터리를 컨텍스트로 삼으면 이
# 저장소만 클론한 사람은 E2E 를 돌릴 수 없는데, 템플릿에서 그건 결함이다.
#
# ## 프로파일 - 기본값과 고르는 법
#
# 백엔드마다 `migrate-*`·`api-*`·`seed-*` 세 서비스가 있고 각각 `profiles:` 로
# 자기 백엔드 이름(`fastapi`/`nestjs`/`rails`) 하나에 묶여 있다 - 활성화된
# 프로파일에 속한 서비스만 뜬다(**프로파일이 붙은 서비스는 활성 프로파일이
# 하나도 없으면 전부 건너뛰어진다** - 실측 완료, 에러 없이 exit 0). `test/e2e/stack.ts`
# 가 하네스를 돌릴 때는 `BACKEND_KIND` 환경변수(기본값 `fastapi`)를 `test/e2e/matrix.ts`
# 의 `resolveBackendKind` 로 좁힌 뒤 그대로 `COMPOSE_PROFILES` 로 자식 프로세스에
# 넘긴다 - 그 파일이 이미 `E2E_WEB_PORT` 로 같은 일을 하고 있어(그 파일의 "포트를
# 한 곳에서만 정한다" 절) 자리를 새로 만들지 않는다.
#
# **사람이 손으로 띄울 때는 `--profile` 을 직접 줘야 한다** - 기본 백엔드는
# FastAPI 다:
#
#   docker compose --profile fastapi -f docker-compose.e2e.yml up
#   docker compose --profile nestjs  -f docker-compose.e2e.yml up
#   docker compose --profile rails   -f docker-compose.e2e.yml up
#
# **내릴 때는 `--profile` 을 세 개 다 준다**(어느 것을 띄웠는지와 무관하게) -
# `down` 도 `up` 과 같은 방식으로 활성 프로파일만 대상으로 삼기 때문에,
# 띄울 때 쓴 프로파일과 다르게 내리면 그 프로파일의 컨테이너가 안 지워지고
# 남는다(`--remove-orphans` 로도 못 잡는다 - orphan 은 "compose 파일에서 아예
# 사라진 서비스"만 대상이다):
#
#   docker compose --profile fastapi --profile nestjs --profile rails \
#     -f docker-compose.e2e.yml down -v --remove-orphans
#
# 저장소 루트 `.env` 에 `COMPOSE_PROFILES=fastapi` 를 커밋해 기본값으로 삼지
# 않는다 - `.env` 는 gitignore 대상이라는 것이 생태계 전체의 관례이고, 이
# 저장소는 템플릿이라 복사되어 수십 개의 저장소가 된다. 그 관례를 뒤집으면
# 복사본 어딘가에서 누군가 `.env` 가 원래 무시된다고 믿고 진짜 시크릿을 거기
# 적었다가 커밋해 버릴 수 있다.
#
# `db`·`redis`·`web` 은 어느 프로파일에도 묶이지 않는다 - 항상 뜬다. 백엔드
# 셋이 같은 `db` 서버(같은 Postgres 컨테이너)를 쓰지만 스키마 충돌은 없다 -
# 프로파일을 동시에 두 개 올리지 않고(각 서비스가 규정) 매 실행 `down -v` 로
# 볼륨을 비우므로, 한 실행에는 언제나 한 백엔드의 테이블만 존재한다.
#
# `web` 의 `depends_on` 이 특정 백엔드 서비스(`api-fastapi` 등)를 가리키지
# **않는 이유**: Compose 는 활성 프로파일에 없는 서비스를 depends_on 이 가리키면
# `invalid compose project` 로 죽는다(`config` 검증 단계부터) - `web` 은 세
# 프로파일 어디서나 뜨는데 depends_on 대상은 매번 다른 이름이라 정적으로
# 하나를 고정할 수 없다. 대신 `docker compose up --wait` 의 "이번 호출에서
# 활성화된 서비스 전부가 healthy/completed 될 때까지 기다린다"는 성질에
# 기댄다 - `migrate-*`·`seed-*`·`api-*` 도 활성 프로파일에 속하는 한 이 대기
# 대상에 들어가므로, Playwright 는 `startStack()` 이 반환한 뒤에만 요청을
# 보내 안전하다.
#
# **`--wait` 자체가 성립하려면 `seed-*` 를 가리키는
# `depends_on: condition: service_completed_successfully` 가 어딘가에는
# 있어야 한다.** `restart:no` 컨테이너가 그 조건으로 참조되지 않은 채 종료
# 되면(`exit 0` 이어도) `--wait` 는 그것을 "예기치 않은 정지"로 보고 스택
# 전체를 실패로 처리한다 - **`web` 은 그 참조를 할 수 없으므로**(바로 위
# 문단), 각 `api-*` 가 같은 프로파일 안에서 그 역할을 대신한다(아래 `api-*`
# 의 `seed-*` depends_on 절). `web` 자신에게는 애초에 `depends_on` 이 없다 -
# 맨 아래 `web` 서비스의 주석 참고.
#
# ## 네트워크 별칭 - `BACKEND_URL` 이 세 프로파일에서 그대로 참인 이유
#
# `web` 은 `BACKEND_URL: http://api:4000` 하나만 안다. 세 `api-*` 서비스 모두
# 기본 네트워크에 별칭 `api` 를 더해 등록한다(`networks.default.aliases`) -
# 그래서 이 환경변수 값 자체는 프로파일을 바꿔도 고칠 필요가 없다. 프로파일이
# 서로 배타적이라(동시에 두 개를 올리지 않는다) 이 별칭을 동시에 두 컨테이너가
# 놓고 다툴 일도 없다.
#
# ## Postgres 에 볼륨을 붙이지 않는다 - 없는 것이 계약이다
#
# `db` 서비스는 아래처럼 `image`·`environment`·`healthcheck` 세 개뿐이다.
# `/var/lib/postgresql` 마운트도 named volume 도 `tmpfs` 도 없다 - 데이터가
# 컨테이너의 쓰기 계층에만 있어서 `down` 한 번에 사라지고, 매 `up` 이 빈
# 데이터베이스에서 시작한다. 개발용 스택을 짜는 본능대로 여기 named volume
# 을 붙이면 두 가지가 조용히 망가진다: (1) rails - `bin/rails db:prepare` 는
# 데이터베이스를 **새로 만든 경우에만** `db:seed` 를 돌리므로, 볼륨이 남아
# `rails_e2e_template` 이 이미 존재하면 두 번째 실행부터 씨앗이 통째로
# 건너뛰어진다. (2) fastapi·nestjs - `examples.sql` 이 이미 있는 행 위에 다시
# 돌아, 고정 id 라 기본 키 충돌로 seed 컨테이너가 죽는다. 볼륨이 필요해
# 보이면 그것은 스택을 재사용하려는 신호이고, 이 스택은 재사용하지 않는 것이
# 설계다.

name: template-typescript-admin-e2e

# Rails 는 빌드 컨텍스트(git 원격)와 환경변수 대부분을 `migrate-rails`·`api-rails`·
# `seed-rails` 가 그대로 공유한다 - 앵커로 묶어 셋 다 고쳐야 하는 자리를 하나로
# 줄인다.
x-rails-build: &rails-build
  context: https://github.com/builder-shin/template-ruby-rails.git#main
  # **`target: development` 가 필수다.** 지정하지 않으면 Dockerfile 의 마지막
  # 스테이지(`production`)가 빌드되는데, 그 스테이지는 `RAILS_ENV=production` 을
  # 굽고 `BUNDLE_WITHOUT="development:test"` 로 그 그룹 젬을 아예 안 받는다.
  # 아래 `DEV_DATABASE_*` 변수는 `config/database.yml` 의 `development:` 블록
  # 에서만 읽히므로 `RAILS_ENV=development` 로 띄워야 하는데, production
  # 이미지 위에서 `RAILS_ENV` 만 덮어쓰면 development 그룹 젬이 없어 그대로
  # 부팅이 죽는다. `development` 스테이지는 그 그룹을 포함해서 받는다.
  target: development

x-rails-env: &rails-env
  RAILS_ENV: development
  DATABASE_HOST: db
  DATABASE_PORT: '5432'
  # `db` 서버·롤은 FastAPI/NestJS 와 같은 것을 재사용하지만(자격증명 아래
  # 참고) 데이터베이스 이름은 **다르게** 준다 - `bin/rails db:prepare` 가 이
  # 이름으로 `CREATE DATABASE` 부터 직접 하게 해서, "이미 존재하는 DB" 로
  # 오인해 `db:seed` 를 건너뛰는 경로를 피한다. `fastapi` 롤은 Postgres
  # 공식 이미지의 부트스트랩 롤이라 CREATEDB 권한을 이미 갖는다.
  DEV_DATABASE_USERNAME: fastapi
  DEV_DATABASE_PASSWORD: fastapi
  DEV_DATABASE_NAME: rails_e2e_template
  # **이 한 줄이 없으면 `bin/rails db:prepare` 가 `fe_sendauth: no password
  # supplied` 로 죽는다.** `config/database.yml` 의 `test:` 블록은
  # `TEST_DATABASE_USERNAME`/`TEST_DATABASE_PASSWORD` 를 따로 읽는데 우리는
  # 그 값을 안 주므로 `ENV.fetch(..., "")` 가 빈 문자열로 떨어져 빈 비밀번호로
  # 우리 `db`(비밀번호 필수)에 붙으려다 실패한다. `db:prepare` 가 development
  # 뿐 아니라 test 데이터베이스까지 준비하려 드는 것이 원인이다.
  SKIP_TEST_DATABASE: '1'
  # `config/secrets.yml` 이 `ENV.fetch("SECRET_KEY_BASE")` 로 기본값 없이
  # 읽는다 - 없으면 RAILS_ENV 와 무관하게 부팅이 죽는다. 운영 값이 아닌
  # E2E 전용 더미.
  SECRET_KEY_BASE: e2e-only-rails-secret-key-base-dummy-value-not-for-production
  # 32바이트 이상이어야 한다(config/initializers/auth.rb - 없거나 짧으면
  # raise 한다). E2E 전용 값이다.
  JWT_SECRET_KEY: e2e-only-jwt-secret-key-at-least-32-bytes-long
  JWT_ISSUER: template-ruby-rails
  JWT_AUDIENCE: template-ruby-rails
  ACTIVE_STORAGE_SERVICE: local
  ACTIVE_JOB_QUEUE_ADAPTER: sidekiq
  PORT: '4000'

services:
  # 세 프로파일이 공유하는 하나의 Postgres 서버. FastAPI·NestJS 는 데이터베이스
  # `fastapi_template` 을 공유하고(테이블 이름까지 같다), Rails 는 `db:prepare`
  # 가 스스로 만드는 `rails_e2e_template` 을 쓴다(위 `x-rails-env` 주석) - 셋 다
  # 같은 서버 위에 있어도 실제로 겹치는 것은 롤 하나뿐이다.
  #
  # 볼륨이 없다 - 파일 머리말 "Postgres 에 볼륨을 붙이지 않는다" 절이 계약이다.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fastapi
      POSTGRES_PASSWORD: fastapi
      POSTGRES_DB: fastapi_template
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fastapi -d fastapi_template']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # 헬스체크가 있어야 아래 api-fastapi 가 `service_healthy` 로 기다릴 수 있다.
    # timeout 을 interval 보다 크게 잡으면 한 번의 검사가 다음 검사 시각을
    # 넘겨서까지 돌 수 있어 의도한 간격이 지켜지지 않는다.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  # ── FastAPI(정본) ──────────────────────────────────────────────────
  migrate-fastapi:
    profiles: [fastapi]
    build: https://github.com/builder-shin/template-python-fastapi.git#main
    # target 없음 - Dockerfile 스테이지는 uv · builder · runtime 이고 마지막이
    # 이미 runtime 이다.
    command: ['alembic', 'upgrade', 'head']
    environment:
      DATABASE_URL: postgresql+psycopg://fastapi:fastapi@db:5432/fastapi_template
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api-fastapi:
    profiles: [fastapi]
    build: https://github.com/builder-shin/template-python-fastapi.git#main
    environment:
      DATABASE_URL: postgresql+psycopg://fastapi:fastapi@db:5432/fastapi_template
      REDIS_URL: redis://redis:6379/0
      # 32바이트 이상이어야 한다(config/auth.py:29). E2E 전용 값이다.
      JWT_SECRET_KEY: e2e-only-jwt-secret-key-at-least-32-bytes-long
      JWT_ISSUER: template-python-fastapi
      JWT_AUDIENCE: template-python-fastapi
    # 기본 네트워크에 별칭 `api` 를 더한다 - 파일 머리말 "네트워크 별칭" 절.
    # 별칭이 셋 다 `api` 인 것이 이 설계의 전부다 - `web` 의 `BACKEND_URL` 이
    # 갈래와 무관하게 같아진다.
    networks:
      default:
        aliases: [api]
    # 호스트에서 백엔드에 직접 닿기 위한 포트 공개. 기본값(published)은 사람이
    # 손으로 `docker compose up` 할 때만 쓰이고, 하네스가 돌 때는
    # `test/e2e/stack.ts` 가 자기 값을 명시적으로 넘긴다(그 파일의 "포트를 한
    # 곳에서만 정한다" 절). 세 프로파일이 같은 변수(`E2E_API_PORT`)·같은
    # 기본값을 쓴다 - 동시에 띄우지 않으므로 부딪힐 일이 없다.
    #
    # 기본값을 4000 이 아니라 4100 으로 고른 이유: `target: 4000`(컨테이너
    # 안의 포트, `BACKEND_URL: http://api:4000` 이 가리키는 바로 그 포트)과
    # 달리 이 `published` 값은 **호스트** 포트라 이미 떠 있는 다른 스택과
    # 부딪힐 수 있어 4000 을 기본값으로 고를 수 없었다.
    ports:
      - target: 4000
        published: '${E2E_API_PORT:-4100}'
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      migrate-fastapi:
        condition: service_completed_successfully
      # seed-fastapi 를 여기서 기다린다(migrate-fastapi 뿐 아니라) - 이유는
      # 파일 머리말의 `web` 무-depends_on 설명과 짝을 이룬다: `docker compose
      # up --wait` 는 **한 번이라도** `service_completed_successfully` 로
      # 참조되지 않은 restart:no 컨테이너가 끝나면 그것을 "예기치 않게
      # 멈췄다"로 보고 실패한다. `web` 은 프로파일별 서비스를 가리킬 수
      # 없으므로, 같은 프로파일 안에서 항상 뜨는 이 서비스가 그 자리를 대신
      # 맡는다 - 부수 효과로 "시드가 끝난 뒤에 api 가 뜬다"도 여기서 함께
      # 보장된다.
      seed-fastapi:
        condition: service_completed_successfully
      # 정본은 오늘 기동 시점에 redis 에 붙지 않아 이 줄이 없어도 스택이
      # 뜬다. 그래도 위 environment 가 이미 `REDIS_URL` 을 주고 있어, 정본이
      # redis 를 쓰는 경로(레이트 리밋·잡 큐)를 여는 순간 이 누락은 오류가
      # 아니라 흔들림으로 나타난다 - api 가 redis 보다 먼저 붙어 실패하는
      # 실행과 성공하는 실행이 섞인다. 비용이 헬스체크 하나라 미리 채운다.
      redis:
        condition: service_healthy

  # 목록·필터·정렬·페이지네이션·상세가 볼 행들을 넣는다(test/e2e/seed/examples.sql).
  #
  # **왜 서비스인가.** 시드를 test/e2e/stack.ts 에서 `docker compose exec` 로
  # 부르면 손으로 `docker compose up` 한 사람은 빈 DB 를 보게 되고, "E2E 가
  # 무엇을 상대로 도는가" 가 compose 파일에 드러나지 않는다. 여기 두면
  # `pnpm compose:verify` 도 이 단계를 함께 검사한다.
  #
  # `migrate-fastapi` 와 같은 모양이다 - `restart: 'no'` 인 일회성 컨테이너이고,
  # 아래 `web` 이 그 완료를 `docker compose up --wait` 의 전체-대기 성질로
  # 기다린다. 즉 앱이 뜨기 전에 데이터가 이미 들어가 있다.
  #
  # 파일 하나가 아니라 **디렉터리**를 마운트한다 - 단일 파일 바인드 마운트는
  # 호스트 OS 마다 동작이 갈리고, 없는 경로를 마운트하면 도커가 그 자리에
  # 빈 디렉터리를 만들어 조용히 0건 시드가 된다. 디렉터리째 읽기 전용으로
  # 걸고 `ON_ERROR_STOP=1` 로 SQL 오류에서 컨테이너가 죽게 한다.
  seed-fastapi:
    profiles: [fastapi]
    image: postgres:18-alpine
    # 접속 정보는 libpq 환경변수로 준다 - 명령줄에 늘어놓으면 한 줄이
    # 백 자를 넘어 서식기가 열두 줄로 펼친다.
    environment:
      PGHOST: db
      PGUSER: fastapi
      PGPASSWORD: fastapi
      PGDATABASE: fastapi_template
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/probe-seed/examples.sql']
    volumes:
      - ./test/e2e/seed:/probe-seed:ro
    depends_on:
      migrate-fastapi:
        condition: service_completed_successfully
    restart: 'no'

  # ── NestJS ──────────────────────────────────────────────────────────
  migrate-nestjs:
    profiles: [nestjs]
    build: https://github.com/builder-shin/template-typescript-nestjs.git#main
    # target 없음 - Dockerfile 스테이지는 builder · runtime 이고 마지막이
    # 이미 runtime 이다. (주의: `builder-shin/template-nestjs-api` 는 존재하는
    # 저장소이지만 Dockerfile 이 없다 - NestJS 백엔드는 이 저장소다.)
    command:
      ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/config/data-source.js']
    environment:
      # `db` 서버·자격증명을 FastAPI 와 그대로 공유한다(테이블 이름이 같으므로
      # 씨앗도 examples.sql 을 그대로 공유한다 - test/e2e/seed/README.md).
      # NestJS 는 DATABASE_URL 하나만 읽으므로 스킴만 다르다
      # (`postgres://` - FastAPI 의 `postgresql+psycopg://` 와 다르다).
      DATABASE_URL: postgres://fastapi:fastapi@db:5432/fastapi_template
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api-nestjs:
    profiles: [nestjs]
    build: https://github.com/builder-shin/template-typescript-nestjs.git#main
    environment:
      DATABASE_URL: postgres://fastapi:fastapi@db:5432/fastapi_template
      PORT: '4000'
      # 32바이트 이상. api-fastapi 와 같은 더미 값을 재사용한다 - 프로파일이
      # 배타적이라 값이 갈릴 이유가 없다.
      JWT_SECRET_KEY: e2e-only-jwt-secret-key-at-least-32-bytes-long
      JWT_ISSUER: template-typescript-nestjs
      JWT_AUDIENCE: template-typescript-nestjs
      # redis 불필요 - NestJS 자체 docker-compose.yml 의 `api` 서비스도
      # REDIS_URL 을 안 준다(백그라운드 잡 워커 전용). 이 E2E 시나리오는
      # 백그라운드 잡을 쓰지 않는다.
    networks:
      default:
        aliases: [api]
    ports:
      - target: 4000
        published: '${E2E_API_PORT:-4100}'
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      migrate-nestjs:
        condition: service_completed_successfully
      # api-fastapi 의 같은 이름 depends_on 절 주석 참고 - `up --wait` 가
      # seed-* 의 정상 종료를 "예기치 않은 정지"로 오판하지 않으려면 같은
      # 프로파일 안의 누군가가 이 조건으로 참조해야 한다.
      seed-nestjs:
        condition: service_completed_successfully

  seed-nestjs:
    profiles: [nestjs]
    # seed-fastapi 와 완전히 같은 이미지·볼륨·명령이다 - examples.sql 을 그대로
    # 공유한다(정본과 NestJS 는 테이블 이름이 같다, test/e2e/seed/README.md).
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: fastapi
      PGPASSWORD: fastapi
      PGDATABASE: fastapi_template
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/probe-seed/examples.sql']
    volumes:
      - ./test/e2e/seed:/probe-seed:ro
    depends_on:
      migrate-nestjs:
        condition: service_completed_successfully
    restart: 'no'

  # ── Rails ───────────────────────────────────────────────────────────
  migrate-rails:
    profiles: [rails]
    build: *rails-build
    command: ['bin/rails', 'db:prepare']
    environment: *rails-env
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api-rails:
    profiles: [rails]
    build: *rails-build
    environment:
      <<: *rails-env
      # **이 한 줄이 Rails 의 컨테이너 내부망 차단을 푸는 유일한 자리다.**
      # `config/environments/{development,production}.rb` 양쪽 다 이 값으로
      # `config.hosts` 를 채운다 - 없으면 Host 헤더가 `api:4000`(compose 내부
      # 에서 `web` 이 호출하는 이름:포트, 위 "네트워크 별칭" 절)일 때 Rails 의
      # DNS 리바인딩 방어가 403 으로 막는다.
      #
      # 대조군 실측(이 값 없이 뜬 컨테이너로 직접 확인): 이 줄이 없으면
      # `GET /health/ready` 가 403 `Blocked hosts: api:4000`, 있으면 200
      # `application/vnd.api+json`.
      #
      # **두 번째 값(`127.0.0.1:${E2E_API_PORT:-4100}`)이 없어도 이 저장소의
      # 스펙 파일은 전부 브라우저를 거쳐 `web`(별칭 `api`)로만 백엔드에
      # 닿으므로 오늘은 즉시 드러나지 않는다** - 그래도 이 값을 뺀 채 두지
      # 않는다. 호스트에 공개된 `${E2E_API_PORT:-4100}` 포트로 직접 찌르는
      # 어떤 진단·향후 테스트도 Host 헤더가 `127.0.0.1:<포트>` 라 이 값이
      # 없으면 같은 403 으로 전멸한다 - 정본이 이미 실측해 둔 자리를 여기서
      # 다시 좁혀 재발견하게 두지 않는다. 값은 아래 `ports.published` 와 같은
      # 변수를 그대로 참조한다 - 포트를 한 곳(`E2E_API_PORT`)에서만 정하는
      # 규칙(test/e2e/stack.ts)이 여기서도 깨지면 안 된다.
      ALLOWED_HOSTS: 'api:4000,127.0.0.1:${E2E_API_PORT:-4100}'
    # `target: development` 스테이지는 Dockerfile 의 HEALTHCHECK(production
    # 스테이지 전용)를 갖지 않는다 - curl 은 base 스테이지에 이미 설치돼
    # 있으므로 같은 커맨드를 compose 레벨에서 준다.
    #
    # **`localhost:4000` 이 아니라 `api:4000` 으로 찌른다 - production
    # 스테이지의 HEALTHCHECK CMD 를 글자 그대로 베끼면 죽는다.**
    # `ALLOWED_HOSTS: 'api:4000'` 이 `config.hosts` 를 그 값 하나로 좁혀서,
    # `Host: localhost:4000` 로 오는 요청은 `/health` 경로라도 **403 Blocked
    # hosts: localhost:4000** 로 막힌다 - production.rb 만 `/health` 경로를
    # host 검사에서 빼 주고(`config.host_authorization = { exclude: ... }`),
    # development.rb 는 그 예외가 없다. `api:4000` 으로 찌르면 Host 헤더가
    # `ALLOWED_HOSTS` 와 일치해 통과한다 - 이 컨테이너 자신이 네트워크 별칭
    # `api` 를 갖고 있어(위 "네트워크 별칭" 절) 자기 자신에게 그 이름으로
    # 닿을 수 있다.
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://api:4000/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      default:
        aliases: [api]
    ports:
      - target: 4000
        published: '${E2E_API_PORT:-4100}'
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      migrate-rails:
        condition: service_completed_successfully
      # api-fastapi 의 같은 이름 depends_on 절 주석 참고 - `up --wait` 가
      # seed-* 의 정상 종료를 "예기치 않은 정지"로 오판하지 않으려면 같은
      # 프로파일 안의 누군가가 이 조건으로 참조해야 한다.
      seed-rails:
        condition: service_completed_successfully

  seed-rails:
    profiles: [rails]
    # examples.rails.sql 을 쓴다 - Rails 는 분류·라벨·조인 테이블 이름이 다르다
    # (test/e2e/seed/README.md). PGDATABASE 도 migrate-rails 가 만드는
    # rails_e2e_template 을 가리킨다 - fastapi_template 이 아니다.
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: fastapi
      PGPASSWORD: fastapi
      PGDATABASE: rails_e2e_template
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/probe-seed/examples.rails.sql']
    volumes:
      - ./test/e2e/seed:/probe-seed:ro
    depends_on:
      migrate-rails:
        condition: service_completed_successfully
    restart: 'no'

  web:
    build:
      context: .
      target: runtime
    environment:
      # 세 갈래에서 이 값이 똑같다 - 갈아끼우면서 고치는 값이 하나도 없다
      # (별칭이 셋 다 `api` 인 설계의 목적, 파일 머리말 "네트워크 별칭" 절).
      BACKEND_URL: http://api:4000
      # `'true'` 다. `sessionCookieSecure` 를 실제로 정하는 자리는 호출부
      # 둘이다(`lib/auth/session.ts` 의 writeSession - 로그인, `proxy.ts` 의
      # 회전 갈래). 이 컨테이너는 `NODE_ENV=production` 이라(Dockerfile) 이
      # 값을 아예 안 줘도 `getSettings()` 의 기본값이 이미 `true` 로
      # 떨어지지만, 그 사실에 기대지 않고 여기서 명시한다 - 두 호출부가
      # `getSettings().sessionCookieSecure` 를 실제로 읽는다는 계약을 이
      # 파일만 보고도 알 수 있게 한다.
      SESSION_COOKIE_SECURE: 'true'
      # 정본은 여기 `TZ`(예: America/Denver)를 준다 - 자신의 `formatDateTime`
      # 이 로컬 시각으로 그리는 결함을 잡기 위해서다. 이 저장소의
      # `formatDateTime`(`components/grid/format.ts`)은 `Date` 객체도
      # `Intl`도 쓰지 않는 순수 문자열 슬라이스(`value.split('T')`)라
      # 컨테이너의 TZ 에 애초에 의존하지 않는다 - 그대로 옮겨 적으면
      # examples 화면에서는 아무것도 지키지 못하는 죽은 설정이 된다.
      # **저장소 전체가 로케일 의존 포맷팅에서 자유롭다는 뜻은 아니다** -
      # `components/chart-area-interactive.tsx`(대시보드 데모 차트)는
      # `new Date`·`toLocaleDateString('en-US')`를 쓴다. 다만 그 렌더는
      # 클라이언트(`'use client'`)에서 일어나 브라우저의 로케일을 따르므로
      # 이 컨테이너의 TZ 와는 애초에 무관하고, examples 화면과도 무관하다.
    ports:
      # 포트를 고정하지 않는다 - 개발 서버(`pnpm dev`)가 이미 3000 을 쓰고
      # 있으면 E2E 가 뜨지 못한다. 기본값 3000 은 사람이 손으로
      # `docker compose -f docker-compose.e2e.yml up` 할 때 쓰이고, 하네스가
      # 돌 때는 test/e2e/stack.ts 가 자기 값을 명시적으로 넘긴다(그 파일의
      # "포트를 한 곳에서만 정한다" 절).
      #
      # host_ip 를 loopback 으로 묶는다 - E2E 앱을 LAN 에 노출할 이유가 없다.
      - target: 3000
        published: '${E2E_WEB_PORT:-3000}'
        host_ip: 127.0.0.1
        protocol: tcp
    # `depends_on` 이 없다 - 백엔드별 서비스(`api-*`·`seed-*`)를 가리키지 못하는
    # 이유는 파일 머리말 "프로파일" 절 참고. `docker compose up --wait` 가 활성
    # 프로파일의 서비스 전부(이 서비스들 포함)를 기다리므로 순서는 여전히
    # 보장된다.
